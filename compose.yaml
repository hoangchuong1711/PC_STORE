services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pc_store
      POSTGRES_USER: pc_store_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create a local .env file}
    ports:
      - "5432:5432"
    volumes:
      - pcstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc_store_app -d pc_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pc_store
      DB_USER: pc_store_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Create a local .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pcstore_pgdata:
