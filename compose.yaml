services:
  backend:
    build: ./backend
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_URL: ${NEON_DB_URL:?Set NEON_DB_URL in .env}
      DB_USER: ${NEON_DB_USER:?Set NEON_DB_USER in .env}
      DB_PASSWORD: ${NEON_DB_PASSWORD:?Set NEON_DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_SEED_ENABLED: ${NEON_DEMO_SEED_ENABLED:-false}
      DEMO_ACCOUNTS_ENABLED: ${NEON_DEMO_ACCOUNTS_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      VNPAY_ENABLED: ${NEON_VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/orders/payment-return}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
