components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "Gọi login để trình duyệt nhận cookie; không dán cookie vào Authorize."
  responses:
    Conflict:
      description: "Xung đột kho, trạng thái, thanh toán hoặc idempotency; xem code/message"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: "Dữ liệu/JSON không hợp lệ; xem code và message"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Chưa đăng nhập, session hết hạn hoặc thông tin đăng nhập sai"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Không có quyền ADMIN"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Sản phẩm, tồn kho, category hoặc brand không tồn tại"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Lỗi máy chủ"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    AdminCategoryInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        componentType:
          type: string
          nullable: true
          enum: [CPU, MOTHERBOARD, RAM, GPU, STORAGE, PSU, CASE, COOLER, null]
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminBrandInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true, maxLength: 2048, description: "HTTP(S) URL, không chứa userinfo" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminTaxonomyStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminTaxonomyEntry:
      type: object
      required: [id, name, description, status, componentType, logoUrl, productCount]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        componentType: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        productCount: { type: integer, format: int64, minimum: 0, description: "Đếm mọi sản phẩm liên kết, kể cả sản phẩm ẩn" }
    AddCartItemRequest:
      "type": "object"
      "required":
        - "productId"
        - "quantity"
      "properties":
        "productId":
          "type": "integer"
          "minimum": 1
        "quantity":
          "type": "integer"
          "minimum": 1
      "additionalProperties": false
    UpdateCartItemRequest:
      "type": "object"
      "required":
        - "quantity"
      "properties":
        "quantity":
          "type": "integer"
          "minimum": 0
      "additionalProperties": false
    CartResponse:
      "type": "object"
      "required":
        - "cartId"
        - "items"
        - "totalAmount"
      "properties":
        "cartId":
          "type": "integer"
          "nullable": true
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CartItemResponse"
        "totalAmount":
          "type": "number"
          "minimum": 0
    CartItemResponse:
      "type": "object"
      "required":
        - "cartItemId"
        - "productId"
        - "name"
        - "quantity"
        - "unitPrice"
        - "lineTotal"
        - "availableQuantity"
        - "available"
      "properties":
        "cartItemId":
          "type": "integer"
        "productId":
          "type": "integer"
        "name":
          "type": "string"
        "quantity":
          "type": "integer"
        "unitPrice":
          "type": "number"
          "minimum": 0
        "lineTotal":
          "type": "number"
          "minimum": 0
        "availableQuantity":
          "type": "integer"
        "available":
          "type": "boolean"
    CheckoutRequest:
      "type": "object"
      "required":
        - "shippingName"
        - "shippingPhone"
        - "shippingAddressText"
        - "paymentMethod"
      "properties":
        "shippingName":
          "type": "string"
          "maxLength": 255
        "shippingPhone":
          "type": "string"
          "maxLength": 32
        "shippingAddressText":
          "type": "string"
        "paymentMethod":
          "type": "string"
          "enum":
            - "COD"
      "additionalProperties": false
    OrderStatusUpdateRequest:
      "type": "object"
      "required":
        - "status"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "CONFIRMED"
            - "SHIPPING"
            - "DELIVERED"
            - "CANCELLED"
    OrderResponse:
      "type": "object"
      "required":
        - "orderId"
        - "orderDate"
        - "status"
        - "totalAmount"
        - "shippingName"
        - "shippingPhone"
        - "shippingAddressText"
        - "deliveredAt"
        - "items"
        - "payment"
      "properties":
        "orderId":
          "type": "integer"
        "orderDate":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
        "status":
          "type": "string"
        "totalAmount":
          "type": "number"
          "minimum": 0
        "shippingName":
          "type": "string"
        "shippingPhone":
          "type": "string"
        "shippingAddressText":
          "type": "string"
        "deliveredAt":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OrderItemResponse"
        "payment":
          "$ref": "#/components/schemas/OrderPaymentResponse"
    OrderItemResponse:
      "type": "object"
      "required":
        - "orderItemId"
        - "productId"
        - "productName"
        - "quantity"
        - "baseUnitPrice"
        - "unitPrice"
        - "lineTotal"
      "properties":
        "orderItemId":
          "type": "integer"
        "productId":
          "type": "integer"
        "productName":
          "type": "string"
        "quantity":
          "type": "integer"
        "baseUnitPrice":
          "type": "number"
          "minimum": 0
        "unitPrice":
          "type": "number"
          "minimum": 0
        "lineTotal":
          "type": "number"
          "minimum": 0
    OrderPaymentResponse:
      "type": "object"
      "required":
        - "paymentId"
        - "method"
        - "status"
        - "amount"
        - "paidAt"
      "properties":
        "paymentId":
          "type": "integer"
        "method":
          "type": "string"
          "enum":
            - "COD"
            - "BANK_TRANSFER"
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "PAID"
            - "FAILED"
        "amount":
          "type": "number"
          "minimum": 0
        "paidAt":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
    ErrorResponse:
      type: "object"
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "string"
        message:
          type: "string"
    RegisterRequest:
      type: "object"
      required:
        - "fullName"
        - "email"
        - "password"
      properties:
        fullName:
          type: "string"
          minLength: 1
          maxLength: 255
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          format: "password"
          minLength: 8
          maxLength: 128
          writeOnly: true
        phone:
          type: "string"
          maxLength: 32
          nullable: true
    LoginRequest:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
        password:
          type: "string"
          format: "password"
          writeOnly: true
    AuthResponse:
      type: "object"
      required:
        - "userId"
        - "fullName"
        - "email"
        - "role"
      properties:
        userId:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phone:
          type: "string"
          nullable: true
        role:
          type: "string"
          enum:
            - "CUSTOMER"
            - "ADMIN"
    ProductStatus:
      type: "string"
      enum:
        - "ACTIVE"
        - "INACTIVE"
        - "DRAFT"
        - "OUT_OF_STOCK"
        - "DISCONTINUED"
        - "HIDDEN"
    Money:
      type: "number"
      minimum: 0
      multipleOf: 1
      description: "VND nguyên đồng; backend dùng BigDecimal/NUMERIC(19,0)."
      example: 1500000
    CategoryResponse:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        componentType:
          type: "string"
          nullable: true
    BrandResponse:
      type: "object"
      properties:
        brandId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        logoUrl:
          type: "string"
          nullable: true
    ProductCategory:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        componentType:
          type: "string"
          nullable: true
    ProductBrand:
      type: "object"
      properties:
        brandId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        logoUrl:
          type: "string"
          nullable: true
    ProductResponse:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        price:
          "$ref": "#/components/schemas/Money"
        status:
          "$ref": "#/components/schemas/ProductStatus"
        category:
          "$ref": "#/components/schemas/ProductCategory"
        brand:
          "$ref": "#/components/schemas/ProductBrand"
