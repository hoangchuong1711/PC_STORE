      "summary": "Checkout COD; replay cùng key/nội dung trả lại đơn"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Replay đơn đã tạo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
          "headers":
            "Idempotent-Replayed":
              "description": "true khi replay, false khi tạo mới"
              "schema":
                "type": "boolean"
        "201":
          "description": "Đơn mới"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
          "headers":
            "Idempotent-Replayed":
              "description": "true khi replay, false khi tạo mới"
              "schema":
                "type": "boolean"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CheckoutRequest"
      "description": "Implementation hiện nhận COD. BANK_TRANSFER đã được chốt trong hướng dẫn nghiệp vụ nhưng checkout/confirm-payment chưa triển khai. Cùng key khác nội dung trả 409 IDEMPOTENCY_KEY_REUSED."
      "parameters":
        -
          "in": "header"
          "name": "Idempotency-Key"
          "required": true
          "schema":
            "type": "string"
            "minLength": 8
            "maxLength": 128
            "pattern": "^[A-Za-z0-9._:-]{8,128}$"
