          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/brands":
    get:
      tags: ["Admin taxonomy"]
      operationId: "listAdminBrand"
      summary: "ADMIN — list brands"
      description: "Không xóa cứng. PUT cập nhật toàn bộ form; endpoint /status chỉ đổi trạng thái. Đổi componentType khi danh mục có sản phẩm trả 409."
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Thành công; dữ liệu đã commit với thao tác ghi"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTaxonomyEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: ["Admin taxonomy"]
      operationId: "createAdminBrand"
      summary: "ADMIN — create brands"
      description: "Không xóa cứng. PUT cập nhật toàn bộ form; endpoint /status chỉ đổi trạng thái. Đổi componentType khi danh mục có sản phẩm trả 409."
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBrandInput"
      responses:
        "201":
          description: "Thành công; dữ liệu đã commit với thao tác ghi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTaxonomyEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/brands/{id}":
    put:
      tags: ["Admin taxonomy"]
      operationId: "updateAdminBrand"
      summary: "ADMIN — update brands"
      description: "Không xóa cứng. PUT cập nhật toàn bộ form; endpoint /status chỉ đổi trạng thái. Đổi componentType khi danh mục có sản phẩm trả 409."
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBrandInput"
      responses:
        "200":
          description: "Thành công; dữ liệu đã commit với thao tác ghi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTaxonomyEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/brands/{id}/status":
    put:
      tags: ["Admin taxonomy"]
      operationId: "setStatusAdminBrand"
      summary: "ADMIN — setStatus brands"
      description: "Không xóa cứng. PUT cập nhật toàn bộ form; endpoint /status chỉ đổi trạng thái. Đổi componentType khi danh mục có sản phẩm trả 409."
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTaxonomyStatusInput"
      responses:
        "200":
          description: "Thành công; dữ liệu đã commit với thao tác ghi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTaxonomyEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "Gọi login để trình duyệt nhận cookie; không dán cookie vào Authorize."
  parameters:
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: ID product_reviews, số nguyên dương trong phạm vi INTEGER
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    SetupId: {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    SetupOffset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    SetupLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
  responses:
    Conflict:
      description: "Xung đột kho, trạng thái, thanh toán hoặc idempotency; xem code/message"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: "Dữ liệu/JSON không hợp lệ; xem code và message"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Chưa đăng nhập, session hết hạn hoặc thông tin đăng nhập sai"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Không có quyền ADMIN"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Sản phẩm, tồn kho, category hoặc brand không tồn tại"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Lỗi máy chủ"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:

    BuilderCatalogProduct:
      type: object
      required: [productId, name, brand, componentType, price, availableQuantity, imageUrl, spec]
      properties:
        productId: {type: integer, minimum: 1}
        name: {type: string}
        brand: {type: string}
        componentType: {type: string, enum: [CPU, MOTHERBOARD, RAM, GPU, STORAGE, PSU, CASE, COOLER]}
        price: {type: number, minimum: 0}
        availableQuantity: {type: integer, minimum: 1}
        imageUrl: {type: string, nullable: true}
        spec:
          allOf: [{$ref: '#/components/schemas/BuilderProductSpec'}]
          nullable: true

    BuilderPreviewRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BuildSelection'}

    SetupRequest:
      type: object
      required: [title, description, mediaIds, productIds]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, minLength: 1}
        mediaIds: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, format: uuid}}
        productIds: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1}}
        
    SetupResponse:
      type: object
      properties:
        postId: {type: integer}
        authorId: {type: integer}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [PUBLISHED, HIDDEN]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        mediaIds: {type: array, items: {type: string, format: uuid}}
        products: {type: array, items: {$ref: '#/components/schemas/SetupProduct'}}
    SetupProduct:
      type: object
      properties:
        productId: {type: integer}
        name: {type: string}
    SetupEligibility:
      type: object
      properties:
        eligible: {type: boolean}
        reason: {type: string, nullable: true, enum: [SETUP_PURCHASE_REQUIRED]}

    BuildRequest:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        items:
          type: array
          description: Danh sách rỗng được lưu như build chưa hoàn chỉnh.
          items: {$ref: '#/components/schemas/BuildSelection'}
    BuildSelection:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: {type: integer, minimum: 1}
        quantity: {type: integer, minimum: 1}
    BuildResponse:
      type: object
      required: [buildId, name, sourceType, items, totalAmount, compatibility]
      properties:
        buildId: {type: integer}
        name: {type: string}
        sourceType: {type: string, enum: [MANUAL, RECOMMENDATION]}
        items:
          type: array
          items: {$ref: '#/components/schemas/BuildItemResponse'}
        totalAmount: {type: number, minimum: 0}
        compatibility: {$ref: '#/components/schemas/CompatibilityReport'}
    BuildItemResponse:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: {type: integer}
        productName: {type: string}
        quantity: {type: integer, minimum: 1}
        unitPrice: {type: number, minimum: 0}
        lineTotal: {type: number, minimum: 0}
    CompatibilityReport:
      type: object
      required: [status, rules]
      properties:
        status: {type: string, enum: [PASS, FAIL, UNKNOWN]}
        rules:
          type: array
          items: {$ref: '#/components/schemas/CompatibilityRule'}
    CompatibilityRule:
      type: object
      required: [id, status, reason]
      properties:
        id: {type: string}
        status: {type: string, enum: [PASS, FAIL, UNKNOWN]}
        reason: {type: string}
    ReviewLikeResponse:
      type: object
      additionalProperties: false
      required: [reviewId, likesCount, isLiked]
      properties:
        reviewId: {type: integer, format: int32, minimum: 1}
        likesCount: {type: integer, format: int64, minimum: 0, description: COUNT từ review_likes}
        isLiked: {type: boolean, description: Customer đăng nhập còn like sau thao tác}
    ModerateReviewRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [HIDDEN, PUBLISHED]}
        moderationReason:
          type: string
          nullable: true
          description: >-
            HIDDEN bắt buộc lý do không trống sau strip(), tối đa 1000 đơn vị UTF-16 sau strip().
            PUBLISHED chỉ được bỏ trường này hoặc gửi null.
    ReviewModerationResponse:
      type: object
      additionalProperties: false
      required: [reviewId, status, moderationReason, moderatedBy, moderatedAt]
      properties:
        reviewId: {type: integer, format: int32, minimum: 1}
        status: {type: string, enum: [PUBLISHED, HIDDEN]}
        moderationReason: {type: string, nullable: true}
        moderatedBy: {type: integer, format: int32, nullable: true}
        moderatedAt:
          type: string
          nullable: true
          description: LocalDateTime ISO-8601 không có offset, diễn giải Asia/Bangkok (UTC+07), chính xác microsecond
          example: '2026-10-08T15:00:00.123456'
    AdminCategoryInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        componentType:
          type: string
          nullable: true
          enum: [CPU, MOTHERBOARD, RAM, GPU, STORAGE, PSU, CASE, COOLER, null]
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminBrandInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true, maxLength: 2048, description: "HTTP(S) URL, không chứa userinfo" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminTaxonomyStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminTaxonomyEntry:
      type: object
      required: [id, name, description, status, componentType, logoUrl, productCount]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        componentType: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        productCount: { type: integer, format: int64, minimum: 0, description: "Đếm mọi sản phẩm liên kết, kể cả sản phẩm ẩn" }
    AddCartItemRequest:
      "type": "object"
      "required":
        - "productId"
        - "quantity"
      "properties":
        "productId":
          "type": "integer"
          "minimum": 1
        "quantity":
          "type": "integer"
          "minimum": 1
      "additionalProperties": false
    UpdateCartItemRequest:
      "type": "object"
      "required":
        - "quantity"
      "properties":
        "quantity":
          "type": "integer"
          "minimum": 0
      "additionalProperties": false
    CartResponse:
      "type": "object"
      "required":
        - "cartId"
        - "items"
        - "totalAmount"
      "properties":
        "cartId":
          "type": "integer"
          "nullable": true
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CartItemResponse"
        "totalAmount":
          "type": "number"
          "minimum": 0
    CartItemResponse:
      "type": "object"
      "required":
        - "cartItemId"
        - "productId"
        - "name"
        - "quantity"
        - "unitPrice"
        - "lineTotal"
        - "availableQuantity"
        - "available"
      "properties":
        "cartItemId":
          "type": "integer"
        "productId":
          "type": "integer"
        "name":
          "type": "string"
        "quantity":
          "type": "integer"
        "unitPrice":
          "type": "number"
          "minimum": 0
        "lineTotal":
          "type": "number"
          "minimum": 0
        "availableQuantity":
          "type": "integer"
        "available":
          "type": "boolean"
    CheckoutRequest:
      "type": "object"
      "required":
        - "shippingName"
        - "shippingPhone"
        - "shippingAddressText"
        - "paymentMethod"
      "properties":
        "shippingName":
          "type": "string"
          "maxLength": 255
        "shippingPhone":
          "type": "string"
          "maxLength": 32
        "shippingAddressText":
          "type": "string"
        "paymentMethod":
          "type": "string"
          "enum":
            - "COD"
      "additionalProperties": false
    OrderStatusUpdateRequest:
      "type": "object"
      "required":
        - "status"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "CONFIRMED"
            - "SHIPPING"
            - "DELIVERED"
            - "CANCELLED"
    OrderResponse:
      "type": "object"
      "required":
        - "orderId"
        - "orderDate"
        - "status"
        - "totalAmount"
        - "shippingName"
        - "shippingPhone"
        - "shippingAddressText"
        - "deliveredAt"
        - "items"
        - "payment"
      "properties":
        "orderId":
          "type": "integer"
        "orderDate":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
        "status":
          "type": "string"
        "totalAmount":
          "type": "number"
          "minimum": 0
        "shippingName":
          "type": "string"
        "shippingPhone":
          "type": "string"
        "shippingAddressText":
          "type": "string"
        "deliveredAt":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OrderItemResponse"
        "payment":
          "$ref": "#/components/schemas/OrderPaymentResponse"
    OrderItemResponse:
      "type": "object"
      "required":
        - "orderItemId"
        - "productId"
        - "productName"
        - "quantity"
        - "baseUnitPrice"
        - "unitPrice"
        - "lineTotal"
      "properties":
        "orderItemId":
          "type": "integer"
        "productId":
          "type": "integer"
        "productName":
          "type": "string"
        "quantity":
          "type": "integer"
        "baseUnitPrice":
          "type": "number"
          "minimum": 0
        "unitPrice":
          "type": "number"
          "minimum": 0
        "lineTotal":
          "type": "number"
          "minimum": 0
    OrderPaymentResponse:
      "type": "object"
      "required":
        - "paymentId"
        - "method"
        - "status"
        - "amount"
        - "paidAt"
      "properties":
        "paymentId":
          "type": "integer"
        "method":
          "type": "string"
          "enum":
            - "COD"
            - "BANK_TRANSFER"
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "PAID"
            - "FAILED"
        "amount":
          "type": "number"
          "minimum": 0
        "paidAt":
          "type": "string"
          "nullable": true
          "description": "LocalDateTime ISO-8601 không có timezone"
    ErrorResponse:
      type: "object"
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "string"
        message:
          type: "string"
    RegisterRequest:
      type: "object"
      required:
        - "fullName"
        - "email"
        - "password"
      properties:
        fullName:
          type: "string"
          minLength: 1
          maxLength: 255
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          format: "password"
          minLength: 8
          maxLength: 128
          writeOnly: true
        phone:
          type: "string"
          maxLength: 32
          nullable: true
    LoginRequest:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
        password:
          type: "string"
          format: "password"
          writeOnly: true
    AuthResponse:
      type: "object"
      required:
        - "userId"
        - "fullName"
        - "email"
        - "role"
      properties:
        userId:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phone:
          type: "string"
          nullable: true
        role:
          type: "string"
          enum:
            - "CUSTOMER"
            - "ADMIN"
    ProductStatus:
      type: "string"
      enum:
        - "ACTIVE"
        - "INACTIVE"
        - "DRAFT"
        - "OUT_OF_STOCK"
        - "DISCONTINUED"
        - "HIDDEN"
    Money:
      type: "number"
      minimum: 0
      multipleOf: 1
      description: "VND nguyên đồng; backend dùng BigDecimal/NUMERIC(19,0)."
      example: 1500000
    CategoryResponse:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        componentType:
          type: "string"
          nullable: true
    BrandResponse:
      type: "object"
      properties:
        brandId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        logoUrl:
          type: "string"
          nullable: true
    ProductCategory:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        componentType:
          type: "string"
          nullable: true
    ProductBrand:
      type: "object"
      properties:
        brandId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        logoUrl:
          type: "string"
          nullable: true
    ProductResponse:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        price:
          "$ref": "#/components/schemas/Money"
        status:
          "$ref": "#/components/schemas/ProductStatus"
        category:
          "$ref": "#/components/schemas/ProductCategory"
        brand:
          "$ref": "#/components/schemas/ProductBrand"
        imageUrls:
          type: "array"
          items:
            type: "string"
        availableQuantity:
          type: "integer"
          format: "int32"
        inStock:
          type: "boolean"
    ProductPageResponse:
      type: "object"
      required:
        - "items"
        - "page"
        - "size"
        - "totalItems"
        - "totalPages"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProductResponse"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalItems:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
    CreateProductRequest:
      type: "object"
      required:
        - "name"
        - "price"
        - "categoryId"
        - "brandId"
        - "quantityOnHand"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        description:
          type: "string"
          nullable: true
        price:
          "$ref": "#/components/schemas/Money"
        categoryId:
          type: "integer"
          format: "int32"
          minimum: 1
        brandId:
          type: "integer"
          format: "int32"
          minimum: 1
        status:
          allOf:
            -
              "$ref": "#/components/schemas/ProductStatus"
          default: "DRAFT"
        quantityOnHand:
          type: "integer"
          format: "int32"
          minimum: 0
        spec:
          "$ref": "#/components/schemas/BuilderProductSpec"
    UpdateProductRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          nullable: true
        description:
          type: "string"
          nullable: true
        price:
          allOf:
            -
              "$ref": "#/components/schemas/Money"
          nullable: true
        categoryId:
          type: "integer"
          format: "int32"
          minimum: 1
          nullable: true
        brandId:
          type: "integer"
          format: "int32"
          minimum: 1
          nullable: true
        status:
          allOf:
            -
              "$ref": "#/components/schemas/ProductStatus"
          nullable: true
        spec:
          "$ref": "#/components/schemas/BuilderProductSpec"
