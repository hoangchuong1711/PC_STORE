openapi: "3.0.3"
info:
  title: "PC Store API"
  version: "1.0.0"
  description: "Danh sách API đã triển khai. Chọn endpoint → Try it out → Execute. Đăng nhập bằng POST /api/auth/login trước khi gọi /me hoặc Admin.
    Cookie được trình duyệt quản lý; nút Authorize không đặt được cookie HttpOnly. Request POST/PATCH thay đổi dữ liệu thật, nên dùng môi trường test. 
    Backend có thể trả lỗi CORS 403 (ORIGIN_NOT_ALLOWED) nếu origin không được phép."
servers:
  -
    url: ".."
    description: "Backend cùng origin/context với tài liệu"
tags:
  - name: Review social
    description: T27 — CUSTOMER like/unlike; ADMIN ẩn/khôi phục review đã có
  -
    name: "Auth"
    description: "Đăng ký, đăng nhập, session"
  -
    name: "Catalog"
    description: "Danh mục sản phẩm public"
  -
    name: "Admin products"
    description: "Chỉ ADMIN. DELETE trả 405; dùng PATCH status HIDDEN để ẩn."
  -
    name: "Media"
    description: "Upload ảnh tạm cho Review và Setup"
  -
    name: "Setup"
    description: "Bài đăng Setup Community (T29)"
paths:
  "/api/setups":
    get:
      tags: [Setup]
      operationId: listPublicSetups
      summary: Danh sách bài PUBLISHED cho khách
      parameters:
        - {$ref: '#/components/parameters/SetupOffset'}
        - {$ref: '#/components/parameters/SetupLimit'}
      responses:
        '200': {description: Danh sách bài, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SetupResponse'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  "/api/setups/{id}":
    get:
      tags: [Setup]
      operationId: getPublicSetup
      summary: Chi tiết bài PUBLISHED; bài ẩn trả 404
      parameters: [{ $ref: '#/components/parameters/SetupId' }]
      responses:
        '200': {description: Bài đăng, content: {application/json: {schema: {$ref: '#/components/schemas/SetupResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  "/api/customer/setups/eligibility":
    get:
      tags: [Setup]
      operationId: getSetupEligibility
      security: [{sessionCookie: []}]
      summary: Kiểm tra tài khoản có đơn DELIVERED
      responses:
        '200': {description: Điều kiện đăng, content: {application/json: {schema: {$ref: '#/components/schemas/SetupEligibility'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  "/api/customer/setups":
    get:
      tags: [Setup]
      operationId: listOwnSetups
      security: [{sessionCookie: []}]
      summary: Bài của tôi, gồm bài HIDDEN
      parameters:
        - {$ref: '#/components/parameters/SetupOffset'}
        - {$ref: '#/components/parameters/SetupLimit'}
      responses:
        '200': {description: Danh sách bài, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SetupResponse'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Setup]
      operationId: createSetup
      security: [{sessionCookie: []}]
      summary: Tạo bài; cần đơn DELIVERED, 1-8 ảnh T21 và ít nhất một Product ACTIVE
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetupRequest'}}}}
      responses:
        '201': {description: Bài đã tạo, content: {application/json: {schema: {$ref: '#/components/schemas/SetupResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Ảnh hoặc Product không hợp lệ, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  "/api/customer/setups/{id}":
    parameters: [{ $ref: '#/components/parameters/SetupId' }]
    get:
      tags: [Setup]
      operationId: getOwnSetup
      security: [{sessionCookie: []}]
      summary: Xem bài của tôi, gồm bài HIDDEN
      responses:
        '200': {description: Bài đăng, content: {application/json: {schema: {$ref: '#/components/schemas/SetupResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Setup]
      operationId: updateOwnSetup
      security: [{sessionCookie: []}]
      summary: Thay nội dung, danh sách ảnh và Product của bài PUBLISHED thuộc mình
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetupRequest'}}}}
      responses:
        '200': {description: Bài đã sửa, content: {application/json: {schema: {$ref: '#/components/schemas/SetupResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Ảnh hoặc Product không hợp lệ, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      tags: [Setup]
      operationId: deleteOwnSetup
      security: [{sessionCookie: []}]
      summary: Xóa bài và đưa media vào hàng đợi dọn
      responses:
        '204': {description: Đã xóa}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/customer/reviews/{reviewId}/like:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    put:
      tags: [Review social]
      operationId: likeReview
      summary: CUSTOMER like review công khai
      description: >-
        Không nhận body. Chủ review suy ra từ OrderItem → Order → User và không được tự like.
        Gọi lặp vẫn chỉ có một like; không đổi created_at. Review HIDDEN/DELETED hoặc không tồn tại đều trả 404.
        likesCount là COUNT từ review_likes, isLiked là trạng thái của customer đăng nhập sau thao tác.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Đã like hoặc đã like từ trước
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewLikeResponse'}
              example: {reviewId: 1, likesCount: 1, isLiked: true}
        '400':
          description: INVALID_ID hoặc INVALID_JSON (body phải rỗng)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN (sai quyền) hoặc SELF_LIKE_NOT_ALLOWED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: REVIEW_NOT_FOUND (không tồn tại hoặc không PUBLISHED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Review social]
      operationId: unlikeReview
      summary: CUSTOMER bỏ like review công khai
      description: >-
        Không nhận body. Chỉ xóa like của customer đăng nhập; nếu chưa like vẫn trả 200 với isLiked=false.
        Chủ review có thể bỏ một self-like cũ nhưng không tạo self-like mới.
        Review HIDDEN/DELETED hoặc không tồn tại đều trả 404, kể cả khi like còn lưu trong database.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Đã bỏ like hoặc không có like từ trước
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewLikeResponse'}
              example: {reviewId: 1, likesCount: 0, isLiked: false}
        '400':
          description: INVALID_ID hoặc INVALID_JSON (body phải rỗng)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN (chỉ CUSTOMER)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: REVIEW_NOT_FOUND (không tồn tại hoặc không PUBLISHED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/reviews/{reviewId}/moderation:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    patch:
      tags: [Review social]
      operationId: moderateReview
      summary: ADMIN ẩn hoặc khôi phục review
      description: >-
        Chỉ chuyển PUBLISHED ↔ HIDDEN. HIDDEN cần lý do đã bỏ khoảng trắng đầu/cuối, 1–1000 đơn vị UTF-16.
        Khôi phục gửi PUBLISHED và không gửi lý do (hoặc null); xóa moderationReason, cập nhật moderatedBy/moderatedAt.
        Gọi lặp cùng trạng thái trả metadata hiện có, không thay lý do/người/thời gian; request vẫn phải hợp lệ.
        Không bao giờ đổi DELETED; trả 409 REVIEW_DELETED. Like/media không bị xóa khi ẩn bài.
        Media công khai bị chặn bởi kiểm tra trạng thái hiện tại của T21.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModerateReviewRequest'}
            examples:
              hide:
                value: {status: HIDDEN, moderationReason: Nội dung không phù hợp}
              restore:
                value: {status: PUBLISHED}
      responses:
        '200':
          description: Trạng thái và metadata kiểm duyệt sau thao tác
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewModerationResponse'}
              example:
                reviewId: 1
                status: HIDDEN
                moderationReason: Nội dung không phù hợp
                moderatedBy: 3
                moderatedAt: '2026-10-08T15:00:00'
        '400':
          description: INVALID_ID, INVALID_JSON, INVALID_REVIEW_STATUS hoặc INVALID_MODERATION_REASON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN (chỉ ADMIN)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: REVIEW_NOT_FOUND (không tồn tại)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: REVIEW_DELETED (không kiểm duyệt review do chủ xóa)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          $ref: '#/components/responses/InternalError'
  "/api/auth/register":
    post:
      tags:
        - "Auth"
      operationId: "register"
      summary: "Đăng ký tài khoản CUSTOMER"
      description: "Email được trim/chuyển chữ thường. Đăng ký không tự đăng nhập."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Đã tạo tài khoản"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "409":
          description: "Email trùng (EMAIL_ALREADY_EXISTS)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/auth/login":
    post:
      tags:
        - "Auth"
      operationId: "login"
      summary: "Đăng nhập và tạo session"
      description: "Dùng tài khoản test của bạn. Trình duyệt tự lưu JSESSIONID HttpOnly; không nhập cookie vào nút Authorize."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Đăng nhập thành công"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            "Set-Cookie":
              description: "JSESSIONID do Tomcat quản lý; HttpOnly; SameSite=Lax; Path=/"
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/auth/logout":
    post:
      tags:
        - "Auth"
      operationId: "logout"
      summary: "Đăng xuất"
      security:
        -
          sessionCookie: []
      responses:
        "204":
          description: "Session đã hủy; không có response body"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/auth/me":
    get:
      tags:
        - "Auth"
      operationId: "currentUser"
      summary: "Thông tin tài khoản hiện tại"
      security:
        -
          sessionCookie: []
      responses:
        "200":
          description: "Thông tin công khai"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/products":
    get:
      tags:
        - "Catalog"
      operationId: "listProducts"
      summary: "Tìm kiếm và phân trang sản phẩm"
      description: "Chỉ trả sản phẩm ACTIVE, category/brand ACTIVE và tồn khả dụng > 0. Các bộ lọc kết hợp AND; sắp xếp productId tăng dần. q tìm tên không phân biệt hoa thường."
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "categoryId"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
        -
          name: "brandId"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
        -
          name: "minPrice"
          in: "query"
          schema:
            type: "number"
            minimum: 0
        -
          name: "maxPrice"
          in: "query"
          description: "Phải >= minPrice"
          schema:
            type: "number"
            minimum: 0
        -
          name: "page"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
            minimum: 0
            default: 0
        -
          name: "size"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Trang sản phẩm; items có thể rỗng"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductPageResponse"
        "400":
          description: "Query sai (INVALID_QUERY)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/products/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    get:
      tags:
        - "Catalog"
      operationId: "getProduct"
      summary: "Chi tiết sản phẩm public"
      description: "Cùng chính sách hiển thị với danh sách; sản phẩm ẩn/hết tồn trả 404."
      responses:
        "200":
          description: "Sản phẩm"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        "400":
          description: "ID sai (INVALID_ID)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "PRODUCT_NOT_FOUND"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/categories":
    get:
      tags:
        - "Catalog"
      operationId: "listCategories"
      summary: "Danh mục ACTIVE"
      responses:
        "200":
          description: "Sắp xếp theo tên rồi ID"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/CategoryResponse"
  "/api/brands":
    get:
      tags:
        - "Catalog"
      operationId: "listBrands"
      summary: "Thương hiệu ACTIVE"
      responses:
        "200":
          description: "Sắp xếp theo tên rồi ID"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/BrandResponse"
  "/api/admin/products":
    post:
      tags:
        - "Admin products"
      operationId: "createProduct"
      summary: "Tạo sản phẩm và tồn kho (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: "Sản phẩm mới; reservedQuantity = 0"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/admin/products/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    get:
      tags:
        - "Admin products"
      operationId: "getAdminProduct"
      summary: "Đọc sản phẩm và thông số kỹ thuật (ADMIN)"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Chi tiết sản phẩm gồm spec đã lưu"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      tags:
        - "Admin products"
      operationId: "updateProduct"
      summary: "Cập nhật hoặc ẩn sản phẩm (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: "Sản phẩm đã cập nhật"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/admin/products/{id}/inventory":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    patch:
      tags:
        - "Admin products"
      operationId: "updateInventory"
      summary: "Cập nhật tồn thực tế (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateInventoryRequest"
      responses:
        "200":
          description: "Tồn kho đã cập nhật"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "INVENTORY_CONFLICT: tồn mới nhỏ hơn lượng giữ chỗ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/builder/products":
    get:
      tags: [Builder]
      operationId: listBuilderProducts
      summary: Linh kiện đang bán, còn tồn, kèm spec cho giao diện Builder
      responses:
        "200":
          description: Danh sách tám nhóm linh kiện; spec null nếu sản phẩm chưa có thông số
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BuilderCatalogProduct'}
  "/api/builder/compatibility":
    post:
      tags: [Builder]
      operationId: previewBuilderCompatibility
      summary: Kiểm tra lựa chọn chưa lưu bằng CompatibilityService T23
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuilderPreviewRequest'}
      responses:
        "200":
          description: PASS, FAIL hoặc UNKNOWN và kết quả từng rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibilityReport'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "404": {$ref: '#/components/responses/NotFound'}
  "/api/customer/builds":
    get:
      tags: [Builder]
      operationId: listBuilds
      summary: Danh sách build của Customer hiện tại
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BuildResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Builder]
      operationId: createBuild
      summary: Lưu build MANUAL, cho phép thiếu linh kiện
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
