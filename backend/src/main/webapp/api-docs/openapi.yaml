openapi: "3.0.3"
info:
  title: "PC Store API"
  version: "1.0.0"
  description: "Danh sách API đã triển khai. Chọn endpoint → Try it out → Execute. Đăng nhập bằng POST /api/auth/login trước khi gọi /me hoặc Admin. Cookie được trình duyệt quản lý; nút Authorize không đặt được cookie HttpOnly. Request POST/PATCH thay đổi dữ liệu thật, nên dùng môi trường test. Backend có thể trả lỗi CORS 403 (ORIGIN_NOT_ALLOWED) nếu origin không được phép."
servers:
  -
    url: ".."
    description: "Backend cùng origin/context với tài liệu"
tags:
  -
    name: "Auth"
    description: "Đăng ký, đăng nhập, session"
  -
    name: "Catalog"
    description: "Danh mục sản phẩm public"
  -
    name: "Admin products"
    description: "Chỉ ADMIN. DELETE trả 405; dùng PATCH status HIDDEN để ẩn."
  -
    name: "Media"
    description: "Upload ảnh tạm cho Review và Setup"
paths:
  "/api/auth/register":
    post:
      tags:
        - "Auth"
      operationId: "register"
      summary: "Đăng ký tài khoản CUSTOMER"
      description: "Email được trim/chuyển chữ thường. Đăng ký không tự đăng nhập."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Đã tạo tài khoản"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "409":
          description: "Email trùng (EMAIL_ALREADY_EXISTS)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/auth/login":
    post:
      tags:
        - "Auth"
      operationId: "login"
      summary: "Đăng nhập và tạo session"
      description: "Dùng tài khoản test của bạn. Trình duyệt tự lưu JSESSIONID HttpOnly; không nhập cookie vào nút Authorize."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Đăng nhập thành công"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            "Set-Cookie":
              description: "JSESSIONID do Tomcat quản lý; HttpOnly; SameSite=Lax; Path=/"
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/auth/logout":
    post:
      tags:
        - "Auth"
      operationId: "logout"
      summary: "Đăng xuất"
      security:
        -
          sessionCookie: []
      responses:
        "204":
          description: "Session đã hủy; không có response body"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/auth/me":
    get:
      tags:
        - "Auth"
      operationId: "currentUser"
      summary: "Thông tin tài khoản hiện tại"
      security:
        -
          sessionCookie: []
      responses:
        "200":
          description: "Thông tin công khai"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/api/products":
    get:
      tags:
        - "Catalog"
      operationId: "listProducts"
      summary: "Tìm kiếm và phân trang sản phẩm"
      description: "Chỉ trả sản phẩm ACTIVE, category/brand ACTIVE và tồn khả dụng > 0. Các bộ lọc kết hợp AND; sắp xếp productId tăng dần. q tìm tên không phân biệt hoa thường."
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "categoryId"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
        -
          name: "brandId"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
        -
          name: "minPrice"
          in: "query"
          schema:
            type: "number"
            minimum: 0
        -
          name: "maxPrice"
          in: "query"
          description: "Phải >= minPrice"
          schema:
            type: "number"
            minimum: 0
        -
          name: "page"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
            minimum: 0
            default: 0
        -
          name: "size"
          in: "query"
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Trang sản phẩm; items có thể rỗng"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductPageResponse"
        "400":
          description: "Query sai (INVALID_QUERY)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/products/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    get:
      tags:
        - "Catalog"
      operationId: "getProduct"
      summary: "Chi tiết sản phẩm public"
      description: "Cùng chính sách hiển thị với danh sách; sản phẩm ẩn/hết tồn trả 404."
      responses:
        "200":
          description: "Sản phẩm"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        "400":
          description: "ID sai (INVALID_ID)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "PRODUCT_NOT_FOUND"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/categories":
    get:
      tags:
        - "Catalog"
      operationId: "listCategories"
      summary: "Danh mục ACTIVE"
      responses:
        "200":
          description: "Sắp xếp theo tên rồi ID"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/CategoryResponse"
  "/api/brands":
    get:
      tags:
        - "Catalog"
      operationId: "listBrands"
      summary: "Thương hiệu ACTIVE"
      responses:
        "200":
          description: "Sắp xếp theo tên rồi ID"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/BrandResponse"
  "/api/admin/products":
    post:
      tags:
        - "Admin products"
      operationId: "createProduct"
      summary: "Tạo sản phẩm và tồn kho (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: "Sản phẩm mới; reservedQuantity = 0"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/admin/products/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    patch:
      tags:
        - "Admin products"
      operationId: "updateProduct"
      summary: "Cập nhật hoặc ẩn sản phẩm (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: "Sản phẩm đã cập nhật"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/admin/products/{id}/inventory":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
        description: "ID sản phẩm"
    patch:
      tags:
        - "Admin products"
      operationId: "updateInventory"
      summary: "Cập nhật tồn thực tế (ADMIN)"
      security:
        -
          sessionCookie: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateInventoryRequest"
      responses:
        "200":
          description: "Tồn kho đã cập nhật"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProductResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "INVENTORY_CONFLICT: tồn mới nhỏ hơn lượng giữ chỗ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/customer/cart":
    "get":
      "tags":
        - "Cart"
      "operationId": "getCart"
      "summary": "Giỏ của Customer hiện tại"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CartResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/customer/cart/items":
    "post":
      "tags":
        - "Cart"
      "operationId": "addCartItem"
      "summary": "Thêm/gộp sản phẩm, không giữ tồn"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CartResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AddCartItemRequest"
  "/api/customer/cart/items/{id}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "integer"
          "minimum": 1
    "patch":
      "tags":
        - "Cart"
      "operationId": "updateCartItem"
      "summary": "Thay số lượng; 0 xóa dòng"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CartResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateCartItemRequest"
    "delete":
      "tags":
        - "Cart"
      "operationId": "deleteCartItem"
      "summary": "Xóa dòng giỏ của Customer"
      "security":
        -
          "sessionCookie": []
      "responses":
        "204":
          "description": "Đã xóa"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/orders":
    "post":
      "tags":
        - "Orders"
      "operationId": "checkoutOrder"
      "summary": "Checkout COD; replay cùng key/nội dung trả lại đơn"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Replay đơn đã tạo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
          "headers":
            "Idempotent-Replayed":
              "description": "true khi replay, false khi tạo mới"
              "schema":
                "type": "boolean"
        "201":
          "description": "Đơn mới"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
          "headers":
            "Idempotent-Replayed":
              "description": "true khi replay, false khi tạo mới"
              "schema":
                "type": "boolean"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CheckoutRequest"
      "description": "Implementation hiện nhận COD. BANK_TRANSFER đã được chốt trong hướng dẫn nghiệp vụ nhưng checkout/confirm-payment chưa triển khai. Cùng key khác nội dung trả 409 IDEMPOTENCY_KEY_REUSED."
      "parameters":
        -
          "in": "header"
          "name": "Idempotency-Key"
          "required": true
          "schema":
            "type": "string"
            "minLength": 8
            "maxLength": 128
            "pattern": "^[A-Za-z0-9._:-]{8,128}$"
    "get":
      "tags":
        - "Orders"
      "operationId": "listOwnedOrders"
      "summary": "Chỉ đơn của Customer hiện tại"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/orders/{id}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "integer"
          "minimum": 1
    "get":
      "tags":
        - "Orders"
      "operationId": "getOwnedOrder"
      "summary": "Đơn không thuộc Customer trả 404"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/orders/{id}/cancel":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "integer"
          "minimum": 1
    "post":
      "tags":
        - "Orders"
      "operationId": "cancelOwnedOrder"
      "summary": "Customer hủy PENDING chưa PAID; hủy lặp không đổi kho"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/admin/orders":
    "get":
      "tags":
        - "Admin orders"
      "operationId": "listAdminOrders"
      "summary": "Admin xem đơn"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/admin/orders/{id}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "integer"
          "minimum": 1
    "get":
      "tags":
        - "Admin orders"
      "operationId": "getAdminOrder"
      "summary": "Admin xem chi tiết đơn"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/admin/orders/{id}/status":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "integer"
          "minimum": 1
    "put":
      "tags":
        - "Admin orders"
      "operationId": "updateOrderStatus"
      "summary": "PENDING → CONFIRMED → SHIPPING → DELIVERED; hủy trước xuất hàng và chưa PAID"
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/OrderStatusUpdateRequest"
  "/api/customer/media/images":
    post:
      tags:
        - "Media"
      operationId: "uploadTemporaryImage"
      summary: "Upload một ảnh tạm đã xác thực"
      description: "Gửi một JPEG/PNG làm body trực tiếp, tối đa 8 MB. Ảnh được chuẩn hóa thành JPEG. mediaId trả về chưa gắn vào bài và chưa có URL công khai. Yêu cầu Origin hợp lệ, session CUSTOMER và header X-Media-Module."
      security:
        - sessionCookie: []
      parameters:
        - name: "X-Media-Module"
          in: "header"
          required: true
          schema:
            type: "string"
            enum: ["SETUP", "REVIEW"]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: "string"
              format: "binary"
          image/png:
            schema:
              type: "string"
              format: "binary"
      responses:
        "201":
          description: "Đã upload và lưu trạng thái TEMP"
          content:
            application/json:
              schema:
                type: "object"
                required: ["mediaId", "module", "status"]
                properties:
                  mediaId:
                    type: "string"
                    format: "uuid"
                  module:
                    type: "string"
                    enum: ["SETUP", "REVIEW"]
                  status:
                    type: "string"
                    enum: ["TEMP"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "Ảnh đầu vào vượt 8 MB hoặc đầu ra vượt 1 MB"
        "415":
          description: "Chỉ hỗ trợ image/jpeg hoặc image/png"
        "429":
          description: "Vượt giới hạn upload"
        "502":
          description: "Cloudinary không sẵn sàng"
  "/api/customer/media/videos":
    post:
      tags: ["Media"]
      operationId: "uploadTemporaryReviewVideo"
      summary: "Upload một video Review tạm"
      description: "Body trực tiếp MP4/MOV H.264 và AAC, tối đa 20 MB, 10 giây. Backend chuyển mã thành MP4 tối đa 4 MB. Yêu cầu Origin hợp lệ, session CUSTOMER và X-Media-Module: REVIEW."
      security:
        - sessionCookie: []
      parameters:
        - name: "X-Media-Module"
          in: "header"
          required: true
          schema:
            type: "string"
            enum: ["REVIEW"]
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: "string"
              format: "binary"
          video/quicktime:
            schema:
              type: "string"
              format: "binary"
      responses:
        "201":
          description: "Đã upload và lưu trạng thái TEMP"
          content:
            application/json:
              schema:
                type: "object"
                required: ["mediaId", "module", "status"]
                properties:
                  mediaId:
                    type: "string"
                    format: "uuid"
                  module:
                    type: "string"
                    enum: ["REVIEW"]
                  status:
                    type: "string"
                    enum: ["TEMP"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "Video nguồn hoặc đầu ra vượt giới hạn"
        "415":
          description: "Chỉ hỗ trợ video/mp4 hoặc video/quicktime"
        "422":
          description: "Video dài hơn 10 giây"
        "429":
          description: "Vượt hạn mức upload hoặc xử lý video đang bận"
        "502":
          description: "Cloudinary không sẵn sàng"
  "/api/media/{mediaId}/content":
    get:
      tags: ["Media"]
      operationId: "getAuthorizedMediaContent"
      summary: "Xem ảnh hoặc video theo quyền hiện tại"
      description: "File TEMP chỉ chủ sở hữu xem được. File đã gắn vào bài công khai được xem; bài ẩn chỉ chủ xem được. Review đã xóa mềm không xem được. Không lộ URL Cloudinary."
      parameters:
        - name: "mediaId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "Range"
          in: "header"
          required: false
          schema:
            type: "string"
          description: "Một byte range, ví dụ bytes=0-1023"
      responses:
        "200":
          description: "Nội dung file"
          content:
            image/jpeg:
              schema:
                type: "string"
                format: "binary"
            video/mp4:
              schema:
                type: "string"
                format: "binary"
        "206":
          description: "Một phần nội dung file theo Range"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: "Byte range không hợp lệ"
        "502":
          description: "Cloudinary không sẵn sàng"
